name: roommate_finder
description: RoomMate Finder - Find your perfect roommate.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State management
  # HTTP
  http: ^1.2.1

  # WebSocket / STOMP
  stomp_dart_client: ^3.0.1

  # Local storage
  shared_preferences: ^2.3.0

  # Image handling
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # UI helpers
  shimmer: ^3.0.0

  # Responsive sizing (.sp / .w / .h / .r) - DESIGN.md "Sizing"
  flutter_screenutil: ^5.9.3

  # Icon set - DESIGN.md "DuotoneIcon"
  solar_icons: ^0.1.0

  # Card swipe
  flutter_card_swiper: ^7.0.1

  # OTP input - custom implementation (no native deps)

  # Date/time
  intl: ^0.19.0

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

# App icon generation — run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FF6B35"
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png

# Splash screen generation — run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FF6B35"
  image: assets/icons/splash_logo.png
  color_dark: "#101114"
  image_dark: assets/icons/splash_logo.png
  android_12:
    color: "#FF6B35"
    image: assets/icons/splash_logo.png
    color_dark: "#101114"
    image_dark: assets/icons/splash_logo.png
